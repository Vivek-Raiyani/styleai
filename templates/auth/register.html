<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — StyleAI Studio</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  {% if flash_messages %}
  <div class="flash-stack">
    {% for msg in flash_messages %}
    <div class="flash flash-{{ msg.kind }}">{{ msg.text }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark" style="background:var(--accent-lime);color:var(--accent-lime-text);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;">✦</div>
        StyleAI Studio
      </div>
      <h1 class="auth-title">Create account.</h1>
      <p class="auth-sub">Save your results and access them anytime.</p>

      <form method="post" action="/auth/register">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-input" type="text" name="username" placeholder="your_name" required autocomplete="username" minlength="2" maxlength="32" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input id="email" class="form-input" type="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-input" type="password" name="password" placeholder="min 8 characters" required autocomplete="new-password" minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Create account <span class="arrow">→</span></button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="/auth/login">Sign in</a>
        &nbsp;·&nbsp; <a href="/auth/guest">Try as guest</a>
      </p>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StyleAI Studio</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  {% if flash_messages %}
  <div class="flash-stack">
    {% for msg in flash_messages %}
    <div class="flash flash-{{ msg.kind }}">{{ msg.text }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark" style="background:var(--accent-lime);color:var(--accent-lime-text);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;">✦</div>
        StyleAI Studio
      </div>
      <h1 class="auth-title">Welcome back.</h1>
      <p class="auth-sub">Sign in to your account to continue.</p>

      <!-- Guest CTA (most prominent) -->
      <a href="/auth/guest" class="btn btn-dark btn-full mb-4" style="justify-content:center;">
        Continue as Guest — no account needed
      </a>

      <div class="auth-divider">or sign in with email</div>

      <form method="post" action="/auth/login">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input id="email" class="form-input" type="email" name="email" placeholder="demo@styleai.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-input" type="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Sign in <span class="arrow">→</span></button>
      </form>

      <p class="auth-footer">
        No account? <a href="/auth/register">Create one</a>
        &nbsp;·&nbsp; Demo: <code style="font-size:0.8rem;">demo@styleai.com / demo1234</code>
      </p>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
